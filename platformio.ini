; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-poe-iso]
board = esp32-poe-iso
lib_compat_mode = strict
framework = arduino
lib_deps =
	esp32async/ESPAsyncWebServer @ ^3.7.10
	bblanchon/ArduinoJson @ ^7.4.2
	mickey9801/ButtonFever @ ^1.0
	ayushsharma82/ElegantOTA @ ^3.1.7
	esp32async/AsyncTCP @ ^3.4.9
lib_ignore = RPAsyncTCP
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions-4MB.csv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-fexceptions
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
