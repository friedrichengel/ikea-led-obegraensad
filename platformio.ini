; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-poe-iso

[env]
lib_compat_mode = strict
framework = arduino
lib_deps =
	esp32async/ESPAsyncWebServer @ ^3.7.10
	bblanchon/ArduinoJson @ ^7.4.2
	mickey9801/ButtonFever @ ^1.0
	ayushsharma82/ElegantOTA @ ^3.1.7
lib_ldf_mode = deep+
monitor_speed = 115200
build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-fexceptions
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src

; Base configuration for all ESP32 boards
[env:esp32-base]
lib_deps =
	${env.lib_deps}
	esp32async/AsyncTCP @ ^3.4.9
lib_ignore = RPAsyncTCP
build_flags =
	${env.build_flags}
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = partitions-4MB.csv
monitor_filters = esp32_exception_decoder

[env:esp32-poe-iso]
extends = env:esp32-base
board = esp32-poe-iso
